services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pizza-app
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.pizza.rule=Host(`pizza.webtga.ru`)"
      - "traefik.http.routers.pizza.entrypoints=websecure"
      - "traefik.http.routers.pizza.tls.certresolver=letsencrypt"
      - "traefik.http.services.pizza.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
