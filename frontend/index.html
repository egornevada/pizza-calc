<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PizzaCalc</title>
    <!-- Telegram Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- лучшее поведение на мобилках -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3ea8">
  </head>
  <body>
    <div id="root"></div>
    <script>
  (function () {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) return;      // открыто не в телеге — просто выходим

    // Телеге: "я готов"
    tg.ready();

    // Раскрыть WebView на максимум
    tg.expand();

    // (необязательно) подхватить тему Телеги
    const tp = tg.themeParams || {};
    document.documentElement.style.setProperty('--tg-bg', tp.bg_color || '#F3F4F6');

    // (необязательно) кнопка Назад
    // tg.BackButton.show();
    // tg.BackButton.onClick(() => tg.close());
  })();
</script>

<style>
  /* чтобы не было «обрезаний» под системные вырезы/клаву */
  html, body, #root { height: 100%; }
  body { min-height: 100dvh; background: var(--tg-bg, #F3F4F6); }
</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
