<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B3EA8" />
    <meta name="color-scheme" content="light dark" />
    <title>PizzaCalc</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
      (function () {
        function initTG() {
          try {
            const tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return; // открыто как обычный сайт — просто выходим

            // применяем тему до монтирования приложения
            const applyTheme = () => {
              const p = tg.themeParams || {};
              const bg = p.bg_color || "#F3F4F6";
              const text = p.text_color || "#111827";
              document.documentElement.style.setProperty("--tg-bg", bg);
              document.documentElement.style.setProperty("--tg-text", text);
              // не обязательно, но помогает некоторым клиентам
              try { tg.setBackgroundColor(bg); } catch (e) {}
            };
            applyTheme();
            tg.onEvent && tg.onEvent("themeChanged", applyTheme);

            // сообщаем Телеге и разворачиваем webview
            tg.ready();
            tg.expand();

            // (по желанию) кнопка Назад закрывает мини-апп
            if (tg.BackButton) {
              tg.BackButton.show();
              tg.BackButton.onClick(() => tg.close());
            }
          } catch (e) {
            console.error("TG init error:", e);
          }
        }

        // на всякий случай ждём полной загрузки, чтобы не было гонки с SDK
        if (document.readyState === "complete") initTG();
        else window.addEventListener("load", initTG);
      })();
    </script>

    <style>
      /* полотно под webview + безопасные зоны */
      html, body, #root { height: 100%; }
      @supports (height: 100svh) {
        html, body, #root { height: 100svh; } /* более точная высота во вьюпорте */
      }
      body {
        margin: 0;
        background: var(--tg-bg, #F3F4F6);
        color: var(--tg-text, #111827);
        min-height: 100dvh;
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Нужно включить JavaScript</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
