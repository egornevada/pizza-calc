<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B3EA8" />
    <meta name="color-scheme" content="light dark" />
    <title>PizzaCalc</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
      (function () {
        try {
          const tg = window.Telegram && window.Telegram.WebApp;
          if (!tg) return; // открыт как обычный сайт — всё ок, просто выходим

          // Применяем тему до монтирования приложения
          const applyTheme = () => {
            const p = tg.themeParams || {};
            document.documentElement.style.setProperty(
              "--tg-bg",
              p.bg_color || "#F3F4F6"
            );
            document.documentElement.style.setProperty(
              "--tg-text",
              p.text_color || "#1f2937"
            );
          };
          applyTheme();
          tg.onEvent && tg.onEvent("themeChanged", applyTheme);

          // Сообщаем Телеге, что всё готово, и разворачиваем webview
          tg.ready();
          tg.expand();

          // (необязательно) Кнопка «Назад» — закрывает мини-апп
          if (tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(() => tg.close());
          }
        } catch (e) {
          console.error("TG init error:", e);
        }
      })();
    </script>

    <style>
      /* Полотно под webview + безопасные зоны */
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--tg-bg, #f3f4f6);
        min-height: 100dvh;
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Нужно включить JavaScript</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
