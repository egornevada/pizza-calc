<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3F4F6" />
    <title>PizzaCalc</title>

    <!-- Telegram Mini App SDK (без него в обычном браузере всё тоже работает) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
      :root{
        /* Цвета подтягиваем из темы Telegram (ниже) */
        --tg-bg:   #f3f4f6;
        --tg-text: #1f2937;
      }
      html, body, #root { height: 100%; }
      body{
        margin: 0;
        min-height: 100dvh;
        background: var(--tg-bg);
        color: var(--tg-text);
        font: 16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
        /* безопасные отступы под вырезы/клавишу-навигации */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <noscript>Нужно включить JavaScript</noscript>

    <!-- Небольшой диагностический принтер ошибок: покажет крэши прямо в мини-аппе -->
    <script>
      (function () {
        function showError(msg) {
          const box = document.createElement('pre');
          box.style.cssText =
            'position:fixed;left:8px;right:8px;bottom:8px;max-height:45vh;overflow:auto;padding:10px;background:#fff3cd;border:1px solid #ffeeba;border-radius:8px;font:12px/1.4 ui-monospace,monospace;z-index:99999';
          box.textContent = msg;
          document.body.appendChild(box);
        }
        window.addEventListener('error', e =>
          showError('JS error: ' + e.message)
        );
        window.addEventListener('unhandledrejection', e =>
          showError(
            'Promise rejection: ' +
              (e.reason && (e.reason.stack || e.reason.message || e.reason))
          )
        );
      })();
    </script>

    <!-- Инициализация Telegram WebApp (в обычном браузере просто ничего не делает) -->
    <script>
      (function () {
        try {
          const tg = window.Telegram && window.Telegram.WebApp;
          if (!tg) return; // открыт как обычный сайт — идём дальше

          // Применяем тему Telegram к CSS-переменным и <meta name="theme-color">
          const themeMeta =
            document.querySelector('meta[name="theme-color"]') ||
            (() => {
              const m = document.createElement('meta');
              m.name = 'theme-color';
              document.head.appendChild(m);
              return m;
            })();

          const applyTheme = () => {
            const p = tg.themeParams || {};
            const bg  = p.bg_color   || '#F3F4F6';
            const txt = p.text_color || '#1F2937';
            document.documentElement.style.setProperty('--tg-bg', bg);
            document.documentElement.style.setProperty('--tg-text', txt);
            themeMeta.content = bg;
          };
          applyTheme();
          tg.onEvent && tg.onEvent('themeChanged', applyTheme);

          // Сообщаем, что готовы, и просим максимальную высоту
          tg.ready();
          tg.expand();

          // (необязательно) системная кнопка «Назад» закрывает мини-апп
          if (tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(() => tg.close());
          }
        } catch (e) {
          console.error('TG init error:', e);
        }
      })();
    </script>

    <!-- Точка входа Vite/React -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
